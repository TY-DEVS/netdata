version: '3.8'

services:
  netdata:
    image: netdata/netdata:stable
    restart: unless-stopped
    hostname: infrahost-vps1
    ports:
      - "19999:19999"
    expose:
      - "19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - NETDATA_CLAIM_TOKEN=VSIn35uruw9AgoM5ll9kOrr2XK_mZE_iesIPG4mIUb7Jk40gYQxawdC5-2YZyGzTylZWspfNOd_W91URK7pQ1ocXzUX1hoV2ifRw00SeTHEeoH_-pYfZcGBuN5xxPLJ2doMeHiQ
      - NETDATA_CLAIM_URL=https://app.netdata.cloud
      - NETDATA_CLAIM_ROOMS=86e25d8c-eb2e-4462-b494-58e6aa70232a
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
